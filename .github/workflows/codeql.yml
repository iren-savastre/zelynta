name: CodeQL

# Analiza statica de securitate pe codul JS/TS (aplicatie + site).
# Ruleaza la push pe main, la PR-uri si saptamanal — ultima parte conteaza,
# fiindca reguli noi apar dupa ce codul a fost deja scris.
# Static security analysis on the JS/TS code (app + site).
# Runs on push to main, on PRs, and weekly — that last part matters,
# because new rules appear after the code has already been written.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # luni, 04:17 UTC # Monday, 04:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze:
    name: Analiza JavaScript/TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # necesar pentru a publica rezultatele in tab-ul Security # needed to publish results to the Security tab
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
