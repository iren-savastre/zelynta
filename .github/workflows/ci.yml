name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Token-ul primit de job-uri poate doar sa citeasca codul. CI-ul nu scrie nimic
# in repo, deci nu are nevoie de mai mult — daca o dependenta compromisa ar rula
# in timpul build-ului, nu ar putea modifica repo-ul.
permissions:
  contents: read

jobs:
  quality:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test

  e2e:
    name: E2E (admin, demo mode)
    # Ruleaza DOAR manual (Actions -> CI -> Run workflow), nu la fiecare push.
    # Testul e2e are nevoie de un server pornit (neconfigurat inca), deci pica in
    # CI si trimitea mail-uri de eroare la fiecare push. Il facem manual pana e gata.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium
      - name: Run e2e
        run: npm run test:e2e
