    :root {

      --surface: #ffffff;
      --text: #1f2d22;
      --muted: #5a6b5e;
      --radius: 22px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:

        radial-gradient(800px 700px at 90% 100%, rgba(133,187,47,0.16), transparent 55%),

      min-height: 100vh;
      line-height: 1.55;
    }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

    /* Bara selector de limba */
    .langbar {
      position: sticky; top: 0; z-index: 50;
      display: flex; justify-content: flex-end; align-items: center;
      padding: 12px 20px;
      background: rgba(241,246,239,0.82);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(46,125,50,0.10);
    }
    .lang-dropdown { position: relative; }
    .lang-current {
      background: var(--surface);
      border: 1px solid rgba(46,125,50,0.16);
      border-radius: 12px;
      padding: 7px 12px;
      cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 3px 12px rgba(31,55,38,0.08);
      font-size: 14px; color: var(--text); font-weight: 600;
    }
    .lang-current img { width: 28px; height: 20px; border-radius: 3px; display: block; }
    .lang-current .chev { color: var(--muted); font-size: 12px; transition: transform .15s ease; }
    .lang-dropdown.open .chev { transform: rotate(180deg); }
    .lang-menu {
      position: absolute; right: 0; top: calc(100% + 8px);
      background: var(--surface);
      border: 1px solid rgba(46,125,50,0.12);
      border-radius: 14px; padding: 6px;
      box-shadow: 0 14px 40px rgba(31,55,38,0.18);
      min-width: 190px;
      display: none; flex-direction: column; gap: 2px;
    }
    .lang-dropdown.open .lang-menu { display: flex; }
    .lang-option {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px; border-radius: 10px;
      cursor: pointer; border: none; background: none; width: 100%;
      font-size: 15px; color: var(--text); text-align: left;
    }
    .lang-option:hover { background: rgba(46,125,50,0.07); }
    .lang-option img { width: 28px; height: 20px; border-radius: 3px; display: block; }
    .lang-option.active { background: #EAF5EA; color: var(--green); font-weight: 700; }
    .lang-option .check { margin-left: auto; color: var(--green); font-weight: 800; }

    /* Hero */
    header { padding: 40px 0 40px; text-align: center; }
    .logo {
      width: 140px; height: 140px;
      margin-bottom: 22px;
      animation: hop 2.2s ease-in-out infinite;
      transform-origin: center bottom;
      will-change: transform;
    }
    @keyframes hop {
      0%   { transform: translateY(0) scale(1); }
      18%  { transform: translateY(-32px) scale(1.06); }
      36%  { transform: translateY(0) scale(1); }
      44%  { transform: translateY(-9px) scale(1.02); }
      54%  { transform: translateY(0) scale(1); }
      100% { transform: translateY(0) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) { .logo { animation: none; } }
    h1 {
      font-size: clamp(34px, 6vw, 56px);
      font-weight: 800; letter-spacing: -0.5px; color: var(--green-dark);
    }
    .tagline {
      font-size: clamp(17px, 2.4vw, 22px);
      color: var(--muted); margin: 14px auto 0; max-width: 560px;
    }

    /* Download */
    .cta { margin-top: 34px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .btn {
      display: inline-flex; align-items: center; gap: 12px;
      background: linear-gradient(180deg, #3E9E3A 0%, var(--green) 100%);
      color: #fff; text-decoration: none; font-weight: 700; font-size: 19px;
      padding: 16px 34px; border-radius: 16px;
      box-shadow: 0 10px 28px rgba(46,125,50,0.35);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(46,125,50,0.42); }
    .btn:active { transform: translateY(0); }
    .btn svg { width: 26px; height: 26px; }
    .cta small { color: var(--muted); font-size: 14px; }
    .free-pill {
      display: inline-block; background: rgba(3,129,65,0.12); color: var(--leaf);
      font-weight: 700; font-size: 13px; padding: 5px 14px; border-radius: 999px;
      letter-spacing: .3px;
    }
    .qr {
      margin: 30px auto 0; display: inline-flex; flex-direction: column; align-items: center;
      background: var(--surface); border-radius: 18px; padding: 18px 20px;
      border: 1px solid rgba(46,125,50,0.10); box-shadow: 0 8px 28px rgba(31,55,38,0.08);
    }
    .qr img { width: 150px; height: 150px; display: block; }
    .qr p { color: var(--muted); font-size: 13px; margin-top: 10px; line-height: 1.35; }

    /* Features */
    section { padding: 40px 0; }
    h2 { text-align: center; font-size: clamp(24px, 3.4vw, 34px); color: var(--green-dark); margin-bottom: 30px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; }
    .card {
      background: var(--surface); border-radius: var(--radius); padding: 26px 24px;
      border: 1px solid rgba(46,125,50,0.10);
      box-shadow: 0 8px 28px rgba(31,55,38,0.07);
    }
    .card .emoji { font-size: 34px; display: block; margin-bottom: 12px; }
    .card h3 { font-size: 18px; color: var(--green-dark); margin-bottom: 6px; }
    .card p { color: var(--muted); font-size: 15px; }

    /* Steps */
    .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; }
    .step { text-align: center; padding: 8px; }
    .step .num {
      width: 46px; height: 46px; border-radius: 50%; margin: 0 auto 12px;
      background: var(--green); color: #fff; font-weight: 800; font-size: 20px;
      display: flex; align-items: center; justify-content: center;
    }
    .step h3 { font-size: 17px; color: var(--green-dark); margin-bottom: 4px; }
    .step p { color: var(--muted); font-size: 15px; }

    /* Disclaimer + footer */
    .note {
      background: rgba(255,255,255,0.6); border: 1px solid rgba(46,125,50,0.12);
      border-radius: 16px; padding: 18px 22px; color: var(--muted); font-size: 14px;
      max-width: 760px; margin: 0 auto; text-align: center;
    }
    footer { text-align: center; padding: 40px 0 56px; color: var(--muted); font-size: 14px; }

    const dropdown = document.getElementById("langDropdown");
    const current = document.getElementById("langCurrent");
    const menu = document.getElementById("langMenu");

    function flagImg(cc, label) {
      return '<img src="https://flagcdn.com/w80/' + cc + '.png" alt="' + label + '" />';
    }

    function closeMenu() {
      dropdown.classList.remove("open");
      current.setAttribute("aria-expanded", "false");
    }

    function applyLang(code) {
      const l = LANGS.find((x) => x.code === code) || LANGS[0];
      const dict = I18N[code] || I18N.ro;
      document.documentElement.lang = code;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (dict[key]) el.textContent = dict[key];
      });
      // butonul-casuta arata limba curenta
      current.innerHTML = flagImg(l.cc, l.label) + "<span>" + l.label + "</span><span class='chev'>▾</span>";
      // marcheaza optiunea activa in meniu
      menu.querySelectorAll(".lang-option").forEach((o) => {
        const on = o.dataset.code === code;
        o.classList.toggle("active", on);
        o.querySelector(".check").textContent = on ? "✓" : "";
      });
      try { localStorage.setItem("zelynta_lang", code); } catch (e) {}
    }

    // Construieste optiunile din meniu
    LANGS.forEach((l) => {
      const o = document.createElement("button");
      o.type = "button";
      o.className = "lang-option";
      o.dataset.code = l.code;
      o.setAttribute("role", "menuitem");
      o.innerHTML = flagImg(l.cc, l.label) + "<span>" + l.label + "</span><span class='check'></span>";
      o.addEventListener("click", () => { applyLang(l.code); closeMenu(); });
      menu.appendChild(o);
    });

    // Deschide / inchide casuta
    current.addEventListener("click", (e) => {
      e.stopPropagation();
      const open = dropdown.classList.toggle("open");
      current.setAttribute("aria-expanded", open ? "true" : "false");
    });
    document.addEventListener("click", (e) => {
      if (!dropdown.contains(e.target)) closeMenu();
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });

    // Limba initiala: salvata > limba browserului > romana
    let saved = null;
    try { saved = localStorage.getItem("zelynta_lang"); } catch (e) {}
    const browser = (navigator.language || "ro").slice(0, 2);
    const initial = saved || (I18N[browser] ? browser : "ro");
    applyLang(initial);
  </script>
